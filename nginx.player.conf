# =================================================================
# nginx site config — SvelteKit player + Phoenix backend
# Save as: /etc/nginx/sites-available/twisted-engine
# Symlink:  ln -s /etc/nginx/sites-available/twisted-engine /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
# =================================================================
# Topology after the migration:
#   Browser ──https──▶ nginx :443 ──┬──▶ SvelteKit (adapter-node) :3000
#                                    ├──▶ Phoenix /api + /socket  :4000
#                                    └──▶ Phoenix /sauce (admin)  :4000
#
# Static assets are served by SvelteKit's adapter-node.
# Phoenix owns:  /api/*, /socket/* (Channels), /sauce/* (LiveView admin).
# Everything else goes to SvelteKit.
# =================================================================

upstream sveltekit_player { server 127.0.0.1:3000; keepalive 64; }
upstream phoenix_backend  { server 127.0.0.1:4000; keepalive 64; }

server {
    listen 80;
    server_name twistedengine.com www.twistedengine.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name twistedengine.com www.twistedengine.com;

    ssl_certificate     /etc/letsencrypt/live/twistedengine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twistedengine.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Phoenix Channels WebSocket ────────────────────────────────
    location /socket/ {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Phoenix REST API ──────────────────────────────────────────
    location /api/ {
        proxy_pass http://phoenix_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Phoenix LiveView admin (AdminSauce) ───────────────────────
    location /sauce/ {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location /live/ {
        proxy_pass http://phoenix_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Phoenix-served static assets (LiveView admin) ─────────────
    location /assets/ {
        proxy_pass http://phoenix_backend;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── SvelteKit player client (everything else) ─────────────────
    location / {
        proxy_pass http://sveltekit_player;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60;
    }

    client_max_body_size 25m;
}
