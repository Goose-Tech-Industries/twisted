#################################################
# Twisted Engine — Full Stack (SOTA Architecture)
# Usage:
#   docker compose up -d              # start all services
#   docker compose up -d --build      # rebuild + start
#   docker compose logs -f backend    # tail Phoenix logs
#   docker compose down               # stop all
#################################################

services:
  # ── PostgreSQL 16 + pgvector ─────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TE_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${TE_DB_DATABASE:-twisted_rpg}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./twisted_rpg_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sequences.sql:/docker-entrypoint-initdb.d/02-sequences.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TE_DB_USER:-postgres} -d ${TE_DB_DATABASE:-twisted_rpg}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (optional PubSub / caching) ────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Phoenix Backend (Elixir / Bandit / BEAM) ─
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8420:8420"
    environment:
      MIX_ENV: production
      PORT: 8420
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      DATABASE_URL: ecto://${TE_DB_USER:-postgres}:${TE_DB_PASSWORD:-postgres}@db:5432/${TE_DB_DATABASE:-twisted_rpg}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-B0tV0l8hFz8G6g+7aD8hFz8G6g+7aD8hFz8G6g+7aD8hFz8G6g+7aD8hFz8G6g+7}
      POOL_SIZE: 15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Player Client (SvelteKit + PixiJS) ───────
  player:
    build:
      context: .
      dockerfile: Dockerfile.ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PUBLIC_PHOENIX_URL: ${PUBLIC_PHOENIX_URL:-http://localhost:8420}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
