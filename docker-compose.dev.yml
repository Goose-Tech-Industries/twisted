#################################################
# Twisted Engine — Dev Mode (SOTA Architecture)
# Usage: docker compose -f docker-compose.dev.yml up
#################################################

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_pass
      POSTGRES_DB: twisted_rpg
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./twisted_rpg_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sequences.sql:/docker-entrypoint-initdb.d/02-sequences.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    image: hexpm/elixir:1.18.2-erlang-27.2.1-alpine-3.21.2
    working_dir: /app
    command: sh -c "mix local.hex --force && mix local.rebar --force && mix deps.get && mix phx.server"
    ports:
      - "8420:8420"
    volumes:
      - ./te_phoenix:/app
    environment:
      MIX_ENV: dev
      PORT: 8420
      TE_DB_HOST: db
      TE_DB_USER: postgres
      TE_DB_PASSWORD: dev_pass
      TE_DB_DATABASE: twisted_rpg
      TE_DB_PORT: 5432
    depends_on:
      - db
      - redis

  player:
    image: node:22-alpine
    working_dir: /app/player
    command: sh -c "corepack enable && pnpm install && pnpm run dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      PUBLIC_PHOENIX_URL: http://localhost:8420
    depends_on:
      - backend

volumes:
  dev_postgres_data:
