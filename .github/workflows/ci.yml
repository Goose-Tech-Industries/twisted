###############################################
# Twisted Engine — CI Pipeline
# Runs on every push and PR to main
###############################################
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ═══════════════════════════════════════════
  # BACKEND: Lint + Battle Tests
  # ═══════════════════════════════════════════
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: te

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: te/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts 2>/dev/null || npm install

      - name: Run battle system tests
        run: npm run test:full

      - name: Run regression tests
        run: npm run test:regression

      - name: Run stress tests
        run: npm run test:stress

  # ═══════════════════════════════════════════
  # FRONTEND: Lint + Build
  # ═══════════════════════════════════════════
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci 2>/dev/null || npm install

      - name: Lint
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  # ═══════════════════════════════════════════
  # DOCKER: Build images (no push)
  # ═══════════════════════════════════════════
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t twisted-backend:ci .

      - name: Build UI image
        run: docker build -f Dockerfile.ui -t twisted-ui:ci --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001 .

  # ═══════════════════════════════════════════
  # DEPLOY (only on push to main)
  # ═══════════════════════════════════════════
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/root/twisted' }}
            git pull origin main
            cd te && npm install --include=optional 2>/dev/null || npm install
            cd ../ui && npm install && npm run build
            cd ..
            pm2 restart ecosystem.config.js --env production
            echo "Deploy complete at $(date)"
