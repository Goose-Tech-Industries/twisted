# =================================================================
# nginx site config — Twisted Engine
# Save as: /etc/nginx/sites-available/twisted-engine
# Symlink:  ln -s /etc/nginx/sites-available/twisted-engine /etc/nginx/sites-enabled/
# Test:     nginx -t && systemctl reload nginx
# =================================================================
# TEACHING: nginx acts as a reverse proxy in front of both the
# Next.js UI (:3000) and the Express backend (:3001).
# The browser only ever talks to nginx on port 443 (HTTPS).
# This gives us: free SSL termination, static asset caching,
# WebSocket proxying, and a single-origin cookie setup.
# =================================================================

server {
    listen 80;
    server_name yourdomain.com;
    # Redirect all HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # ── SSL (Certbot will fill these in) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Socket.IO — MUST come first ──────────────────────────────
    # WebSocket upgrade requires special proxy headers.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # keep WebSocket alive for 24h
    }

    # ── API / Auth / Admin → Express backend (:3001) ─────────────
    location /auth/       { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /login       { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /register    { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /me          { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /logout      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /api/        { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /admin/world-forge/ {
        proxy_pass http://127.0.0.1:3001;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 180;   # AI generation can take 2-3 minutes
        proxy_connect_timeout 10;
    }
    location /admin/      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /admin-panel/ { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /mod-panel/  { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /health      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }

    # Game routes (legacy endpoints used by game.js)
    location /my-characters      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /get-char-full      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /create-character   { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /creation-data      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /get-map            { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /get-all-maps       { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /save-state         { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /load-state         { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /equip-item         { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /unequip-item       { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /use-item           { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /get-shop           { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /buy-item           { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /sell-item          { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /my-oghams          { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /fast-travel-points { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }

    # ── Vanilla AdminSauce & legacy game client ──────────────────
    location /sauce/      { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /adminsauce/ { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /game.html   { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /profile/    { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /card/       { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /join        { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }
    location /verify-email { proxy_pass http://127.0.0.1:3001; include /etc/nginx/proxy_params; }

    # ── Everything else → Next.js UI (:3000) ─────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static asset caching ─────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 5m;
}
