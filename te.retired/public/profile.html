<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
        --bg:    #010409;
        --bg2:   #0d1117;
        --bg3:   #161b22;
        --border:#21262d;
        --t:     #e8eef6;
        --dim:   #8b949e;
        --dimmer:#484f58;
        --a:     #bb86fc;
        --green: #3fb950;
        --red:   #f85149;
        --gold:  #ffaa00;
        --teal:  #03dac6;
    }
    body { background:var(--bg);color:var(--t);font-family:'Courier New',monospace;min-height:100vh; }
    a { color:var(--a);text-decoration:none; }
    a:hover { text-decoration:underline; }

    .page { max-width:860px;margin:0 auto;padding:40px 20px; }

    /* Back bar */
    .back-bar { margin-bottom:24px;font-size:12px; }
    .back-bar a { color:var(--dimmer); }
    .back-bar a:hover { color:var(--dim); }

    /* Header card */
    .profile-header {
        background:var(--bg3);border:1px solid var(--border);border-radius:12px;
        padding:28px;display:flex;gap:24px;align-items:flex-start;margin-bottom:20px;
    }
    .profile-avatar {
        width:72px;height:72px;border-radius:50%;background:rgba(187,134,252,0.15);
        border:2px solid rgba(187,134,252,0.3);display:flex;align-items:center;
        justify-content:center;font-size:32px;flex-shrink:0;
    }
    .profile-main { flex:1; }
    .profile-name {
        font-size:26px;font-weight:bold;color:var(--t);display:flex;align-items:center;gap:10px;
    }
    .profile-title {
        font-size:12px;color:var(--teal);
        padding:2px 10px;border:1px solid rgba(3,218,198,0.3);border-radius:20px;
        background:rgba(3,218,198,0.08);letter-spacing:.5px;
    }
    .profile-sub  { font-size:12px;color:var(--dim);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap; }
    .profile-guild { color:var(--gold);margin-top:4px;font-size:12px; }
    .profile-level { font-size:22px;font-weight:bold;color:var(--a);white-space:nowrap;text-align:right; }
    .profile-level span { font-size:11px;color:var(--dimmer);display:block;text-align:right; }

    /* Section */
    .section { background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px; }
    .section-title { font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dimmer);margin-bottom:14px; }

    /* Stats grid */
    .stats-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px; }
    .stat-box    { background:rgba(255,255,255,0.03);border-radius:8px;padding:12px;text-align:center; }
    .stat-label  { font-size:9px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.5px; }
    .stat-val    { font-size:18px;font-weight:bold;color:var(--t);margin-top:4px; }

    /* Battle record */
    .battle-row  { display:flex;gap:24px;align-items:center; }
    .br-item     { text-align:center; }
    .br-val      { font-size:22px;font-weight:bold; }
    .br-label    { font-size:10px;color:var(--dimmer);text-transform:uppercase;margin-top:2px; }
    .br-ratio    { font-size:13px;color:var(--teal);margin-left:auto; }

    /* Equipment grid */
    .equip-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px; }
    .equip-slot {
        background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;
        padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:12px;
    }
    .equip-slot.empty { opacity:.4; }
    .equip-icon { font-size:18px; }
    .equip-name { color:var(--t); }
    .equip-slot-label { font-size:10px;color:var(--dimmer); }
    /* Rarity colours */
    .rarity-COMMON   { color:var(--dim); }
    .rarity-UNCOMMON { color:var(--green); }
    .rarity-RARE     { color:#58a6ff; }
    .rarity-EPIC     { color:var(--a); }
    .rarity-LEGENDARY{ color:var(--gold); }

    /* Achievements */
    .achiev-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px; }
    .achiev-card {
        background:rgba(255,170,0,0.05);border:1px solid rgba(255,170,0,0.15);border-radius:8px;
        padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
    }
    .achiev-icon { font-size:20px;flex-shrink:0; }
    .achiev-name { font-size:12px;font-weight:bold;color:var(--gold); }
    .achiev-desc { font-size:10px;color:var(--dimmer);margin-top:2px; }
    .achiev-date { font-size:10px;color:var(--green);margin-top:3px; }

    /* Custom accent color applied via JS */
    :root { --accent: #bb86fc; }

    /* Bio / quote */
    .profile-bio {
        font-size:13px;color:var(--dim);line-height:1.7;
        margin-top:10px;max-width:560px;white-space:pre-wrap;
    }
    .profile-quote {
        border-left:3px solid var(--accent);padding:8px 14px;
        font-style:italic;color:var(--dim);font-size:13px;margin-top:12px;
        background:rgba(255,255,255,0.02);border-radius:0 6px 6px 0;
    }

    /* Spotify card */
    .spotify-card {
        background:rgba(30,215,96,0.06);border:1px solid rgba(30,215,96,0.2);
        border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
    }
    .spotify-label { font-size:10px;color:#1ed760;text-transform:uppercase;letter-spacing:.8px; }
    .spotify-track { font-size:14px;font-weight:bold;color:#e8eef6; }
    .spotify-artist { font-size:12px;color:var(--dim); }
    .spotify-embed  { border-radius:10px;overflow:hidden;margin-top:4px; }

    /* Forum signature */
    .profile-signature {
        border-top:1px solid var(--border);margin-top:14px;padding-top:12px;
        font-size:12px;line-height:1.7;color:var(--dim);
    }
    .profile-sig-label {
        font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--dimmer);margin-bottom:6px;
    }

    /* View counter + last seen */
    .profile-meta-row {
        display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--dimmer);margin-top:6px;
    }

    /* Top Friends */
    .top-friends-grid {
        display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
    }
    .tf-card {
        background:var(--bg2);border:1px solid var(--border);border-radius:10px;
        padding:10px 6px;text-align:center;cursor:pointer;transition:.12s;
        text-decoration:none;display:block;
    }
    .tf-card:hover { border-color:var(--accent);background:rgba(255,255,255,0.04); }
    .tf-icon  { font-size:24px;margin-bottom:4px; }
    .tf-name  { font-size:11px;font-weight:bold;color:var(--fg);word-break:break-word;line-height:1.3; }
    .tf-level { font-size:10px;color:var(--dimmer);margin-top:2px; }
    .tf-title { font-size:9px;margin-top:1px; }

    /* Status badge */
    .presence-badge {
        display:inline-flex;align-items:center;gap:5px;
        padding:2px 10px;border-radius:20px;font-size:10px;letter-spacing:.3px;
        border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);
    }

    /* Error / loading */
    .loading-msg, .error-msg {
        text-align:center;padding:60px 20px;color:var(--dimmer);font-size:14px;
    }
    .error-msg { color:var(--red); }
    .card-action-link {
        padding:5px 12px;border-radius:6px;border:1px solid rgba(187,134,252,.3);
        background:rgba(187,134,252,.08);color:#bb86fc;font-size:11px;text-decoration:none;
        font-family:'Courier New',monospace;white-space:nowrap;display:inline-block;
    }
    .card-action-link:hover { background:rgba(187,134,252,.18); }
</style>
</head>
<body>
<div class="page">
    <div class="back-bar"><a href="/">← Back to Game</a></div>
    <div id="root"><div class="loading-msg">Loading profile…</div></div>
</div>

<script>
(async () => {
    // Profile name is in the URL: /profile/CharacterName
    const name = decodeURIComponent(location.pathname.split('/profile/')[1] || '').trim();
    if (!name) {
        document.getElementById('root').innerHTML = '<div class="error-msg">No character name specified.</div>';
        return;
    }

    document.title = name + ' — Profile';

    // Fetch profile data
    let d;
    try {
        const r = await fetch(`/api/achievements/profile/${encodeURIComponent(name)}`);
        d = await r.json();
    } catch {
        document.getElementById('root').innerHTML = '<div class="error-msg">Network error. Please try again.</div>';
        return;
    }

    if (!d.success) {
        document.getElementById('root').innerHTML = `<div class="error-msg">Character "${esc(name)}" not found.</div>`;
        return;
    }

    const c  = d.character;
    const br = d.battleRecord || { W: 0, L: 0, T: 0 };
    const ratio = (br.L > 0) ? (br.W / br.L).toFixed(2) : (br.W || 0) + '.00';

    // Class icons
    const CLASS_ICONS = { Warrior:'⚔️', Mage:'🔮', Rogue:'🗡️', Healer:'💚',
                          Ranger:'🏹', Paladin:'🛡️', Necromancer:'💀', Bard:'🎵' };
    const classIcon = CLASS_ICONS[c.class_name] || '⚔️';

    // Equipment slots — map by slot_key for display
    const equipBySlot = {};
    for (const e of (d.equipment || [])) equipBySlot[e.slot_key] = e;
    const SLOT_DISPLAY = [
        ['weapon','Weapon'],['offhand','Off-Hand'],['helmet','Helmet'],
        ['chest','Chest'],['legs','Legs'],['boots','Boots'],
        ['ring1','Ring 1'],['ring2','Ring 2'],['neck','Neck'],['trinket','Trinket'],
    ];

    const root = document.getElementById('root');
    root.innerHTML = `

        <!-- Header -->
        <div class="profile-header">
            <div class="profile-avatar">${classIcon}</div>
            <div class="profile-main">
                <div class="profile-name">
                    ${esc(c.name)}
                    ${c.equipped_title ? `<span class="profile-title" style="color:${c.profile_color||'#03dac6'};border-color:${c.profile_color||'#03dac6'}44">${esc(c.equipped_title)}</span>` : ''}
                </div>
                <div class="profile-sub">
                    <span>${classIcon} ${esc(c.class_name || '?')}</span>
                    <span>🧬 ${esc(c.race_name || '?')}</span>
                    ${c.bg_name ? `<span>📖 ${esc(c.bg_name)}</span>` : ''}
                </div>
                ${c.guild_name ? `<div class="profile-guild">🏰 ${esc(c.guild_name)}${c.guild_tag ? ` [${esc(c.guild_tag)}]` : ''}</div>` : ''}
                <div class="profile-meta-row">
                    ${c.profile_views ? `<span>👁 ${c.profile_views.toLocaleString()} view${c.profile_views !== 1 ? 's' : ''}</span>` : ''}
                    ${d.friendCount ? `<span>👥 ${d.friendCount} friend${d.friendCount !== 1 ? 's' : ''}</span>` : ''}
                    ${c.last_seen_at ? `<span>🕐 ${formatLastSeen(c.last_seen_at)}</span>` : ''}
                    ${d.isFriend ? `<span class="friend-badge">💚 Friends</span>` : ''}
                </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
                <div class="profile-level">Lv.${c.level}<span>Level</span></div>
                <a href="/card/${encodeURIComponent(c.name)}" class="card-action-link" target="_blank">🃏 Card</a>
                ${!d.isOwnProfile && d.viewerCharId ? `
                <button class="report-btn" onclick="openReportModal(${c.id},'${esc(c.name)}')">🚩 Report</button>` : ''}
                ${d.isOwnProfile && d.inviteCode ? `
                <button class="invite-copy-btn" onclick="copyInviteLink('${d.inviteCode}')" title="Copy your invite link">
                    🔗 Invite Link
                </button>` : ''}
            </div>
        </div>

        <!-- Bio & quote -->
        ${c.profile_bio || c.profile_favorite_quote ? `
        <div class="section" style="border-color:${(c.profile_color||'#21262d')}33">
            ${c.presence_status && c.presence_status !== 'online' ? `
            <div style="margin-bottom:10px">
                <span class="presence-badge">
                    ${c.presence_status==='away'?'🌙':c.presence_status==='busy'?'🔴':c.presence_status==='lfp'?'⚔️':'👻'}
                    ${esc(c.presence_status.toUpperCase())}
                    ${c.away_message ? ` — <em>${esc(c.away_message)}</em>` : ''}
                </span>
            </div>` : ''}
            ${c.profile_bio ? `<div class="profile-bio">${esc(c.profile_bio)}</div>` : ''}
            ${c.profile_favorite_quote ? `<div class="profile-quote">${esc(c.profile_favorite_quote)}</div>` : ''}
        </div>` : ''}

        <!-- Spotify -->
        ${c.spotify_track_url ? `
        <div class="spotify-card">
            <div class="spotify-label">🎵 Currently Listening</div>
            ${c.spotify_track_name ? `<div class="spotify-track">${esc(c.spotify_track_name)}</div>` : ''}
            ${c.spotify_artist_name ? `<div class="spotify-artist">by ${esc(c.spotify_artist_name)}</div>` : ''}
            ${(() => {
                const match = c.spotify_track_url.match(/open\.spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
                if (!match) return '';
                const [,type,id] = match;
                return \`<div class="spotify-embed">
                    <iframe style="border-radius:12px"
                        src="https://open.spotify.com/embed/${type}/${id}?utm_source=generator&theme=0"
                        width="100%" height="152" frameBorder="0"
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                        loading="lazy"></iframe>
                </div>\`;
            })()}
        </div>` : ''}

        ${buildPersonalSection(c, d.topFriends || [])}

        <!-- Stats -->
        <div class="section">
            <div class="section-title">Character Stats</div>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-label">HP</div><div class="stat-val" style="color:#e74c3c">${c.max_hp}</div></div>
                <div class="stat-box"><div class="stat-label">MP</div><div class="stat-val" style="color:#2e86c1">${c.max_mp}</div></div>
                <div class="stat-box"><div class="stat-label">ATK</div><div class="stat-val">${c.atk}</div></div>
                <div class="stat-box"><div class="stat-label">DEF</div><div class="stat-val">${c.def}</div></div>
                <div class="stat-box"><div class="stat-label">M.ATK</div><div class="stat-val">${c.mo || 0}</div></div>
                <div class="stat-box"><div class="stat-label">M.DEF</div><div class="stat-val">${c.md || 0}</div></div>
                <div class="stat-box"><div class="stat-label">Speed</div><div class="stat-val">${c.speed || 0}</div></div>
                <div class="stat-box"><div class="stat-label">Luck</div><div class="stat-val">${c.luck || 0}</div></div>
            </div>
        </div>

        <!-- Battle Record -->
        <div class="section">
            <div class="section-title">Battle Record</div>
            <div class="battle-row">
                <div class="br-item"><div class="br-val" style="color:#3fb950">${br.W}</div><div class="br-label">Wins</div></div>
                <div class="br-item"><div class="br-val" style="color:#f85149">${br.L}</div><div class="br-label">Losses</div></div>
                <div class="br-item"><div class="br-val" style="color:#8b949e">${br.T || 0}</div><div class="br-label">Ties</div></div>
                <div class="br-ratio">W/L Ratio: ${ratio}</div>
            </div>
        </div>

        <!-- Equipment -->
        <div class="section">
            <div class="section-title">Equipment</div>
            <div class="equip-grid">
                ${SLOT_DISPLAY.map(([key, label]) => {
                    const item = equipBySlot[key];
                    if (!item) return `<div class="equip-slot empty"><div class="equip-icon">○</div><div><div class="equip-slot-label">${label}</div><div style="color:#30363d;font-size:11px">Empty</div></div></div>`;
                    const rar = (item.rarity || 'COMMON').toUpperCase();
                    return `<div class="equip-slot">
                        <div class="equip-icon">${item.icon || '🗡️'}</div>
                        <div>
                            <div class="equip-slot-label">${label}</div>
                            <div class="equip-name rarity-${rar}">${esc(item.name)}</div>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        </div>

        <!-- Achievements -->
        ${d.achievements && d.achievements.length ? `
        <div class="section">
            <div class="section-title">Achievements (${d.achievements.length})</div>
            <div class="achiev-grid">
                ${d.achievements.map(a => `
                    <div class="achiev-card">
                        <div class="achiev-icon">${esc(a.icon)}</div>
                        <div>
                            <div class="achiev-name">${esc(a.title)}</div>
                            <div class="achiev-desc">${esc(a.description || '')}</div>
                            <div class="achiev-date">${formatDate(a.earned_at)}</div>
                        </div>
                    </div>`).join('')}
            </div>
        </div>` : ''}

    `;

    // Load guestbook asynchronously after main content renders
    loadGuestbook(c.id);

    // Show "who viewed your profile" if own profile + opted in
    if (d.isOwnProfile && d.profileViewers && d.profileViewers.length) {
        renderProfileViewers(d.profileViewers);
    }

    // Show invite link section if own profile
    if (d.isOwnProfile && d.inviteCode) {
        const root = document.getElementById('root');

        // ── Invite Link Section ────────────────────────────────────
        const invSection = document.createElement('div');
        invSection.className = 'section';
        invSection.innerHTML = `
            <h3 class="section-title" style="color:var(--accent)">🔗 Your Invite Link</h3>
            <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
                <code style="background:#161b22;border:1px solid #30363d;border-radius:6px;
                             padding:7px 12px;font-size:12px;flex:1;color:#8b949e;overflow:hidden;
                             text-overflow:ellipsis;white-space:nowrap">
                    ${esc(location.origin)}/join?ref=${esc(d.inviteCode)}
                </code>
                <button class="invite-copy-btn" onclick="copyInviteLink('${esc(d.inviteCode)}')">📋 Copy</button>
            </div>
            <div style="font-size:10px;color:var(--dimmer);margin-top:8px">
                Share this link — when someone registers with it and levels up, you earn a reward. ✨
            </div>`;
        root.appendChild(invSection);

        // ── Referral Stats Section ─────────────────────────────────
        const rs = d.referralStats;
        if (rs) {
            const refSection = document.createElement('div');
            refSection.className = 'section';

            const paidCount  = rs.paidCount;
            const totalCount = rs.totalReferred;
            const pending    = totalCount - paidCount;

            let rowsHtml = '';
            if (rs.referrals.length === 0) {
                rowsHtml = `<div style="color:var(--dimmer);font-size:12px;padding:16px 0;text-align:center">
                    No one has used your invite link yet. Share it and start earning!
                </div>`;
            } else {
                rowsHtml = rs.referrals.map(r => `
                <div style="display:flex;align-items:center;justify-content:space-between;
                            padding:7px 0;border-bottom:1px solid #21262d">
                    <div>
                        <span style="font-size:13px;color:var(--fg);font-weight:bold">${esc(r.charName)}</span>
                        <span style="font-size:11px;color:var(--dimmer);margin-left:8px">Lv.${r.level}</span>
                    </div>
                    <div>
                        ${r.rewardPaid
                            ? '<span style="font-size:11px;color:#3fb950;background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);border-radius:10px;padding:2px 8px">✅ Reward Paid</span>'
                            : '<span style="font-size:11px;color:#8b949e;background:rgba(255,255,255,.04);border:1px solid #30363d;border-radius:10px;padding:2px 8px">⏳ Pending</span>'}
                    </div>
                </div>`).join('');
            }

            refSection.innerHTML = `
            <h3 class="section-title" style="color:var(--accent)">👥 Referrals</h3>
            <div style="display:flex;gap:16px;margin:10px 0 14px">
                <div style="text-align:center">
                    <div style="font-size:22px;font-weight:bold;color:var(--accent)">${totalCount}</div>
                    <div style="font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.5px">Invited</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:22px;font-weight:bold;color:#3fb950">${paidCount}</div>
                    <div style="font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.5px">Rewards Paid</div>
                </div>
                <div style="text-align:center">
                    <div style="font-size:22px;font-weight:bold;color:#f39c12">${pending}</div>
                    <div style="font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.5px">Pending</div>
                </div>
            </div>
            ${rowsHtml}
            ${totalCount > 0 ? `<div style="font-size:10px;color:var(--dimmer);margin-top:8px">
                Rewards pay out when each recruit levels up to the threshold level.
            </div>` : ''}`;
            root.appendChild(refSection);
        }
    }
})();

function buildPersonalSection(c, topFriends) {
    let html = '';

    // Apply accent color
    const accent = c.profile_color || '#bb86fc';
    document.documentElement.style.setProperty('--accent', accent);
    document.querySelectorAll('.profile-title').forEach(el => {
        el.style.color = accent;
        el.style.borderColor = accent + '44';
    });

    // Presence badge
    const PRESENCE_ICONS = { away:'🌙', busy:'🔴', lfp:'⚔️', invisible:'👻', online:'🟢' };
    let presenceHtml = '';
    if (c.presence_status && c.presence_status !== 'online') {
        const icon = PRESENCE_ICONS[c.presence_status] || '';
        const label = c.presence_status.toUpperCase();
        const awayMsg = c.away_message ? ` — <em>${esc(c.away_message)}</em>` : '';
        presenceHtml = `<div style="margin-bottom:10px">
            <span class="presence-badge">${icon} ${esc(label)}${awayMsg}</span></div>`;
    }

    // Bio + quote section
    if (presenceHtml || c.profile_bio || c.profile_favorite_quote) {
        html += `<div class="section" style="border-color:${accent}33">
            ${presenceHtml}
            ${c.profile_bio ? `<div class="profile-bio">${esc(c.profile_bio)}</div>` : ''}
            ${c.profile_favorite_quote ? `<blockquote class="profile-quote">${esc(c.profile_favorite_quote)}</blockquote>` : ''}
        </div>`;
    }

    // Spotify section
    if (c.spotify_track_url) {
        const match = c.spotify_track_url.match(/open\.spotify\.com\/(track|album|playlist)\/([a-zA-Z0-9]+)/);
        let embedHtml = '';
        if (match) {
            const [,sType,sId] = match;
            embedHtml = `<div class="spotify-embed">
                <iframe style="border-radius:12px"
                    src="https://open.spotify.com/embed/${sType}/${sId}?utm_source=generator&theme=0"
                    width="100%" height="152" frameBorder="0"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"></iframe></div>`;
        }
        html += `<div class="spotify-card">
            <div class="spotify-label">🎵 Currently Listening</div>
            ${c.spotify_track_name  ? `<div class="spotify-track">${esc(c.spotify_track_name)}</div>` : ''}
            ${c.spotify_artist_name ? `<div class="spotify-artist">by ${esc(c.spotify_artist_name)}</div>` : ''}
            ${embedHtml}
        </div>`;
    }

    // Top Friends
    if (topFriends && topFriends.length > 0) {
        const CLASS_ICONS = { Warrior:'⚔️', Mage:'🔮', Rogue:'🗡️', Healer:'💚',
                              Ranger:'🏹', Necromancer:'💀', Paladin:'🛡️', Druid:'🌿' };
        const accent = c.profile_color || '#bb86fc';
        const cards = topFriends.map(f => `
            <a href="/profile/${encodeURIComponent(f.name)}" class="tf-card">
                <div class="tf-icon">${CLASS_ICONS[f.class_name] || '⚔️'}</div>
                <div class="tf-name">${esc(f.name)}</div>
                <div class="tf-level">Lv.${f.level}</div>
                ${f.equipped_title ? `<div class="tf-title" style="color:${f.profile_color||accent}">[${esc(f.equipped_title)}]</div>` : ''}
            </a>`).join('');
        html += `<div class="section">
            <h3 class="section-title" style="color:${accent}">⭐ Top Friends</h3>
            <div class="top-friends-grid">${cards}</div>
        </div>`;
    }

    // Signature
    if (c.profile_signature) {
        html += `<div class="profile-signature">
            <div class="profile-sig-label">✍️ Signature</div>
            <div>${c.profile_signature}</div>
        </div>`;
    }

    return html;
}

function formatLastSeen(ts) {
    if (!ts) return '';
    const diff = Date.now() - new Date(ts).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 2) return 'Last seen just now';
    if (mins < 60) return `Last seen ${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `Last seen ${hrs}h ago`;
    const days = Math.floor(hrs / 24);
    if (days < 7) return `Last seen ${days}d ago`;
    return `Last seen ${new Date(ts).toLocaleDateString()}`;
}

function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function formatDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

// =================================================================
// GUESTBOOK
// =================================================================
let _profileCharId = null;
let _myCharId      = null;

async function loadGuestbook(profileCharId) {
    _profileCharId = profileCharId;
    const root = document.getElementById('root');
    const gbSection = document.createElement('div');
    gbSection.className = 'section';
    gbSection.id = 'gbSection';
    gbSection.innerHTML = `
        <h3 class="section-title" style="color:var(--accent)">📖 Guestbook</h3>
        <div id="gbEntries"><div style="color:var(--dimmer);font-size:12px">Loading…</div></div>
        <div id="gbPostArea"></div>`;
    root.appendChild(gbSection);

    try {
        const r = await fetch('/api/guestbook/' + profileCharId);
        const d = await r.json();
        renderGuestbook(d.entries || []);
    } catch { document.getElementById('gbEntries').innerHTML = '<div style="color:#f85149;font-size:12px">Could not load.</div>'; }

    // Check if viewer is logged in and not viewing their own profile
    try {
        const me = await fetch('/me', { credentials:'include' });
        const md = await me.json();
        if (md.success && md.charId && md.charId !== profileCharId) {
            _myCharId = md.charId;
            renderPostForm();
        }
    } catch {}
}

function renderGuestbook(entries) {
    const el = document.getElementById('gbEntries');
    if (!el) return;
    if (!entries.length) {
        el.innerHTML = '<div style="color:var(--dimmer);font-size:12px;padding:8px 0">No entries yet. Be the first to sign!</div>';
        return;
    }
    el.innerHTML = entries.map(e => {
        const color = e.author_color || '#bb86fc';
        const diff  = Date.now() - new Date(e.created_at).getTime();
        const m     = Math.floor(diff/60000);
        const when  = m < 2 ? 'just now' : m < 60 ? m+'m ago' : Math.floor(m/60)+'h ago';
        return `<div class="gb-entry" id="gbe_${e.id}">
            <div class="gb-avatar">✍️</div>
            <div class="gb-entry-body">
                <div class="gb-entry-meta">
                    <a href="/profile/${encodeURIComponent(e.author_name)}" class="gb-author-name"
                       style="color:${esc(color)};text-decoration:none">${esc(e.author_name)}</a>
                    ${e.author_title ? `<span class="gb-author-title" style="color:${esc(color)}">[${esc(e.author_title)}]</span>` : ''}
                    <span class="gb-entry-time">${when}</span>
                    <button class="gb-delete-btn" onclick="deleteGbEntry(${e.id})" title="Delete">🗑️</button>
                </div>
                <div class="gb-entry-text">${e.message_html}</div>
            </div>
        </div>`;
    }).join('');
}

function renderPostForm() {
    const el = document.getElementById('gbPostArea');
    if (!el) return;
    el.innerHTML = `
    <div class="gb-post-form">
        <div style="font-size:10px;color:var(--dimmer);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">
            ✍️ Sign this guestbook
            <span style="color:#484f58"> · once per 24h · BBCode supported</span>
        </div>
        <textarea class="gb-post-textarea" id="gbMsg" maxlength="500"
            placeholder="[b]Hey![/b] Great adventuring with you! ⚔️"></textarea>
        <div style="display:flex;align-items:center;gap:10px">
            <button class="gb-post-btn" onclick="submitGuestbook()">✍️ Sign</button>
            <div class="gb-msg" id="gbPostMsg"></div>
        </div>
    </div>`;
}

async function submitGuestbook() {
    const msg   = document.getElementById('gbMsg')?.value?.trim();
    const msgEl = document.getElementById('gbPostMsg');
    if (!msg || msg.length < 2) { msgEl.style.color='#f85149'; msgEl.textContent='❌ Too short.'; return; }
    try {
        const r = await fetch('/api/guestbook/post', {
            method:'POST', credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ authorCharId:_myCharId, profileCharId:_profileCharId, message:msg })
        });
        const d = await r.json();
        if (d.success) {
            msgEl.style.color='#3fb950'; msgEl.textContent='✅ Signed!';
            document.getElementById('gbMsg').value = '';
            const el = document.getElementById('gbEntries');
            const noMsg = el.querySelector('[style*="dimmer"]');
            if (noMsg) noMsg.remove();
            const div = document.createElement('div');
            div.innerHTML = `<div class="gb-entry" id="gbe_${d.entry.id}">
                <div class="gb-avatar">✍️</div>
                <div class="gb-entry-body">
                    <div class="gb-entry-meta">
                        <span class="gb-author-name" style="color:${esc(d.entry.author_color||'#bb86fc')}">${esc(d.entry.author_name)}</span>
                        <span class="gb-entry-time">just now</span>
                        <button class="gb-delete-btn" onclick="deleteGbEntry(${d.entry.id})">🗑️</button>
                    </div>
                    <div class="gb-entry-text">${d.entry.message_html}</div>
                </div>
            </div>`;
            el.prepend(div.firstElementChild);
        } else { msgEl.style.color='#f85149'; msgEl.textContent='❌ '+(d.error||'Failed.'); }
    } catch(e) { msgEl.style.color='#f85149'; msgEl.textContent='❌ '+e.message; }
}

async function deleteGbEntry(id) {
    if (!confirm('Delete this entry?')) return;
    const r = await fetch('/api/guestbook/delete', {
        method:'POST', credentials:'include',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ entryId:id })
    });
    const d = await r.json();
    if (d.success) { const el = document.getElementById('gbe_'+id); if(el) el.remove(); }
}

// =================================================================
// WHO VIEWED MY PROFILE
// =================================================================
// TEACHING: This only appears on your OWN profile, and only if you
// opted in (show_profile_viewers = 1). The data comes from the
// profile API response as d.profileViewers[].
function renderProfileViewers(viewers) {
    const root = document.getElementById('root');
    if (!root || !viewers || !viewers.length) return;

    const section = document.createElement('div');
    section.className = 'section';
    section.id = 'profileViewersSection';

    const timeAgo = (ts) => {
        const m = Math.floor((Date.now() - new Date(ts)) / 60000);
        if (m < 2)  return 'just now';
        if (m < 60) return m + 'm ago';
        const h = Math.floor(m/60);
        if (h < 24) return h + 'h ago';
        return Math.floor(h/24) + 'd ago';
    };

    section.innerHTML = `
        <h3 class="section-title" style="color:var(--accent)">👁 Who Viewed Your Profile</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">
            ${viewers.map(v => `
            <a href="/profile/${encodeURIComponent(v.viewer_name)}"
               style="display:flex;align-items:center;gap:6px;padding:6px 10px;
                      border-radius:7px;border:1px solid ${esc(v.viewer_color||'#21262d')}44;
                      background:${esc(v.viewer_color||'#21262d')}11;text-decoration:none;
                      font-size:11px;color:${esc(v.viewer_color||'#bb86fc')}">
                <span style="font-size:13px">👤</span>
                <span>${esc(v.viewer_name)}</span>
                ${v.viewer_title ? `<span style="opacity:.6;font-size:10px">[${esc(v.viewer_title)}]</span>` : ''}
                <span style="opacity:.45;font-size:10px">${timeAgo(v.viewed_at)}</span>
            </a>`).join('')}
        </div>
        <div style="font-size:10px;color:var(--dimmer);margin-top:10px">
            Showing up to 50 viewers from the last 30 days. 
            <a href="#" onclick="disableViewers(event)" style="color:var(--dimmer);text-decoration:underline">Turn off</a>
        </div>`;
    root.appendChild(section);
}

async function disableViewers(e) {
    e.preventDefault();
    // Toggle off via save-profile — we don't have the full form here,
    // so just do a minimal PATCH using the profile editor if available
    alert("Open your profile editor (in-game) and uncheck 'Show who viewed my profile' to disable this.");
}

function openReportModal(charId, charName) {
    const existing = document.getElementById('reportModal');
    if (existing) existing.remove();

    const modal = document.createElement('div');
    modal.id = 'reportModal';
    modal.style.cssText = `
        position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;
        display:flex;align-items:center;justify-content:center;`;
    modal.innerHTML = `
    <div style="background:#0d1117;border:1px solid #30363d;border-radius:12px;
                padding:24px;width:360px;max-width:calc(100vw - 32px);font-family:'Courier New',monospace">
        <div style="font-size:14px;font-weight:bold;margin-bottom:16px;color:#e8eef6">
            🚩 Report ${esc(charName)}
        </div>
        <div style="font-size:11px;color:#8b949e;margin-bottom:12px">
            Reports are reviewed by moderators. Abuse of this system may result in action against your account.
        </div>
        <div style="margin-bottom:12px">
            <label style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Reason</label>
            <select id="reportReason" style="width:100%;background:#161b22;border:1px solid #30363d;border-radius:6px;
                color:#e8eef6;padding:8px;font-family:'Courier New',monospace;font-size:12px;outline:none">
                <option value="harassment">Harassment</option>
                <option value="cheating">Cheating / Exploiting</option>
                <option value="spam">Spam</option>
                <option value="offensive_name">Offensive Name</option>
                <option value="bug_abuse">Bug Abuse</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div style="margin-bottom:16px">
            <label style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:6px">Details <span style="color:#484f58">(optional)</span></label>
            <textarea id="reportDetails" maxlength="500"
                style="width:100%;background:#161b22;border:1px solid #30363d;border-radius:6px;
                       color:#e8eef6;padding:8px;font-family:'Courier New',monospace;font-size:12px;
                       resize:none;min-height:60px;outline:none;box-sizing:border-box"
                placeholder="Describe what happened…"></textarea>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
            <button onclick="document.getElementById('reportModal').remove()"
                style="padding:8px 16px;border-radius:6px;border:1px solid #30363d;background:none;
                       color:#8b949e;cursor:pointer;font-family:'Courier New',monospace;font-size:12px">
                Cancel
            </button>
            <button onclick="submitReport(${charId})"
                style="padding:8px 16px;border-radius:6px;border:1px solid rgba(248,81,73,.4);
                       background:rgba(248,81,73,.12);color:#f85149;cursor:pointer;
                       font-family:'Courier New',monospace;font-size:12px">
                🚩 Submit Report
            </button>
        </div>
        <div id="reportMsg" style="font-size:11px;min-height:18px;margin-top:8px;text-align:center"></div>
    </div>`;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

async function submitReport(reportedCharId) {
    const reason  = document.getElementById('reportReason')?.value;
    const details = document.getElementById('reportDetails')?.value?.trim();
    const msgEl   = document.getElementById('reportMsg');
    try {
        // Get our own charId from /me
        const me = await fetch('/me', { credentials:'include' });
        const md = await me.json();
        if (!md.success || !md.charId) {
            msgEl.style.color = '#f85149';
            msgEl.textContent = '❌ You must be logged in to report.';
            return;
        }
        const r = await fetch('/api/auth/report-player', {
            method:'POST', credentials:'include',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({
                reporterCharId: md.charId,
                reportedCharId, reason, details
            })
        });
        const d = await r.json();
        if (d.success) {
            msgEl.style.color = '#3fb950';
            msgEl.textContent = '✅ Report submitted. Thank you.';
            setTimeout(() => document.getElementById('reportModal')?.remove(), 2000);
        } else {
            msgEl.style.color = '#f85149';
            msgEl.textContent = '❌ ' + (d.error || 'Failed.');
        }
    } catch(e) {
        msgEl.style.color = '#f85149';
        msgEl.textContent = '❌ ' + e.message;
    }
}

// =================================================================
// INVITE LINK
// =================================================================
function copyInviteLink(code) {
    const url = `${location.origin}/join?ref=${code}`;
    navigator.clipboard.writeText(url).then(() => {
        showCopyToast('🔗 Invite link copied!');
    }).catch(() => {
        prompt('Copy your invite link:', url);
    });
}

function showCopyToast(msg) {
    const t = document.createElement('div');
    t.style.cssText = `
        position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
        background:#161b22;border:1px solid #30363d;border-radius:8px;
        padding:10px 20px;font-size:12px;font-family:'Courier New',monospace;
        color:#3fb950;z-index:9999;pointer-events:none;`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
