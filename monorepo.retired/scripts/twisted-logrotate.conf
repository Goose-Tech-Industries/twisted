# =================================================================
# Twisted Engine — Log rotation config
#
# Install:
#   sudo cp scripts/twisted-logrotate.conf /etc/logrotate.d/twisted
#   sudo logrotate -d /etc/logrotate.d/twisted   ← dry run / test
#   sudo logrotate -f /etc/logrotate.d/twisted   ← force run
#
# Logrotate runs automatically via cron.daily — no cron entry needed.
# =================================================================

# ── Nginx access + error logs ─────────────────────────────────────
/var/log/nginx/twisted-access.log
/var/log/nginx/twisted-error.log {
    daily               # rotate every day
    rotate 14           # keep 14 days of logs
    compress            # gzip rotated files
    delaycompress       # compress previous rotation, not the current one
                        # (nginx might still be writing to it)
    missingok           # don't error if log file doesn't exist yet
    notifempty          # don't rotate empty log files
    sharedscripts
    postrotate
        # Tell nginx to reopen log files after rotation
        # TEACHING: Without this nginx keeps writing to the old (renamed)
        # file. USR1 signal tells it to open the new file at the original path.
        [ -f /var/run/nginx.pid ] && kill -USR1 $(cat /var/run/nginx.pid)
    endscript
}

# ── PM2 / Node.js app logs ────────────────────────────────────────
# PM2 writes logs to ~/.pm2/logs/ by default.
# If you used the ecosystem.config.js paths (./logs/*.log), add them here.
/var/www/twisted/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate    # TEACHING: Unlike nginx, Node holds the file open.
                    # copytruncate copies the log then truncates the original
                    # in-place — PM2 keeps writing without needing a signal.
}
