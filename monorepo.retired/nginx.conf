# =================================================================
# Twisted Engine — Nginx Reverse Proxy
# Single domain serves both Next.js UI and Express backend.
#
# Routing table:
#   /                 → Next.js UI (port 3000)
#   /adminsauce       → Next.js UI (/adminsauce page)   ← NEVER CHANGES
#   /api/*            → Express backend (port 3001)
#   /admin-panel/*    → Express backend (port 3001)
#   /admin/*          → Express backend (port 3001)
#   /auth/*           → Express backend (port 3001)
#   /socket.io/*      → Express backend WebSocket (port 3001)
#   /mod-panel        → Express backend (port 3001)
#
# To enable: sudo ln -s /etc/nginx/sites-available/twisted /etc/nginx/sites-enabled/
# Then:      sudo nginx -t && sudo systemctl reload nginx
# =================================================================

# ── Logging format ────────────────────────────────────────────────
# TEACHING: The default nginx log format doesn't include response time
# or upstream address. This custom format adds both, making it easy
# to spot slow backend routes and identify which upstream handled a request.
log_format twisted '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time ua="$upstream_addr"';

upstream nextjs_ui {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream express_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS in production
    # Comment this block out and use the HTTPS server block below
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── Logging ───────────────────────────────────────────────────
    access_log /var/log/nginx/twisted-access.log twisted;
    error_log  /var/log/nginx/twisted-error.log warn;

    # ── Request size limit ────────────────────────────────────────
    # TEACHING: Matches the 50kb limit set in Express. Nginx rejects
    # oversized bodies before they even reach Node, saving resources.
    # If you ever add file uploads, raise this per-route with a
    # location-level override.
    client_max_body_size 50k;

    # ── SSL (Certbot will fill these in) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Global proxy settings ─────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;

    # ── Socket.IO — WebSocket upgrade ────────────────────────────
    # Must come before the generic /api block so WS connections hit Express
    location /socket.io/ {
        proxy_pass          http://express_backend;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }

    # ── Express backend routes ────────────────────────────────────
    location ~ ^/(api|auth|admin-panel|admin|mod-panel|adminsauce-api)/ {
        proxy_pass http://express_backend;
    }

    # Flat backend routes (no trailing slash)
    location ~ ^/(login|register|logout|me|my-characters|get-char-full|create-character|creation-data|get-map|get-all-maps|save-state|load-state|equip-item|unequip-item|use-item|get-shop|buy-item|sell-item|my-oghams)$ {
        proxy_pass http://express_backend;
    }

    # ── Backend utility + invite routes ───────────────────────────
    # TEACHING: These backend routes would otherwise fall through to Next.js
    # (the catch-all location /) and return 404. They must be explicitly
    # proxied to Express so they work from the public domain.
    #
    # /health  — UptimeRobot + load balancer health checks
    # /version — confirm which build is live without SSH
    # /join    — shareable invite link (?ref=CODE → redirects to /?ref=CODE#register)
    # /profile — public player profile pages
    # /card    — trading card pages
    location ~ ^/(health|version)$ {
        proxy_pass http://express_backend;
    }

    location ~ ^/(join)$ {
        proxy_pass http://express_backend;
    }

    location ~ ^/(profile|card)/ {
        proxy_pass http://express_backend;
    }

    # ── /adminsauce → Next.js UI ──────────────────────────────────
    # NON-NEGOTIABLE: /adminsauce always loads the Next.js admin UI.
    # Do NOT reroute this to Express. The Next.js /adminsauce page
    # calls /admin-panel/* Express routes for its data.
    location /adminsauce {
        proxy_pass          http://nextjs_ui;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }

    # ── Next.js static assets ────────────────────────────────────
    location /_next/ {
        proxy_pass http://nextjs_ui;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Everything else → Next.js UI ─────────────────────────────
    location / {
        proxy_pass          http://nextjs_ui;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
    }
}
